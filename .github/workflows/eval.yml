# Eval gate: Promptfoo golden dataset over the true agent pipeline.
# Runs on PRs or direct pushes touching the pipeline or eval suite.
# Needs OLLAMA_API_KEY (+ optional USDA_API_KEY) repo secret — Ollama
# Cloud serves the generator AND the judge from the same key.
name: eval

"on":
  pull_request:
    paths: [".github/workflows/eval.yml", "evals/**", "src/**", "uv.lock"]
  push:
    branches: [main]
    paths: [".github/workflows/eval.yml", "evals/**", "src/**", "uv.lock"]
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  pull-requests: write

env:
  # Single Ollama endpoint env for both consumers (no local ollama on the
  # runner — everything rides Ollama Cloud): the Python pipeline reads it
  # via Settings, promptfoo's ollama judge provider reads OLLAMA_BASE_URL.
  OLLAMA_BASE_URL: https://api.ollama.com
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  USDA_API_KEY: ${{ secrets.USDA_API_KEY }}

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # action needs history for change detection

      - name: Install Node 24 (promptfoo requires >= 22.22)
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync Python deps + seed data
        run: |
          uv sync --no-progress
          PYTHONPATH=. uv run python scripts/run_seeds.py

      - name: Run eval suite
        id: eval
        uses: promptfoo/promptfoo-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config: evals/promptfooconfig.yaml
          use-config-prompts: 'true'
        env:
          PYTHONPATH: .

      - name: Compute eval badge
        if: ${{ github.event_name != 'pull_request' && always() }}
        run: |
          PYTHONPATH=. python3 evals/badge.py

      - name: Commit badge to main
        if: ${{ github.ref_name == 'main' && always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain --quiet -- .github/badges; then
            echo "no badge change"; exit 0
          fi
          git add .github/badges
          git commit -m "ci: update eval badge [skip eval]"
          git push origin main
