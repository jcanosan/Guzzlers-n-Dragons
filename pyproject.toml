[project]
name = "guzzlers-n-dragons"
version = "0.1.0"
description = "AI recipe alchemist that transforms fictional ingredients into cookable recipes"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "langchain>=1.3.17",
    "langgraph>=1.2.11",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "chromadb>=1.5.9",
    "sqlalchemy>=2.0.52",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "fastembed>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "ty>=0.0.74",
    "pre-commit>=4.6.2",
]

[build-system]
requires = [
    "setuptools>=83.0.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 80
target-version = "py314"
lint.select = ["E", "F", "I", "UP", "W"]
lint.ignore = ["UP037"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
