# Golden dataset (Phase 2). Provider output is a JSON string:
#   recipe / report / iterations / constraints
# Shared assertions:
#   qa_structure.py   - generic structure (runs on every case via defaultTest)
#   qa_constraints.py - servings exact-match + prep/cook within limits
#   banned.py         - recipe-only banned-ingredient check (`banned` var;
#                       critic report excluded — it may legitimately name offenders)
# Judge (`llm-rubric`, one dimension: cookable + theme-plausible) runs via
# nemotron-3-super:cloud, see promptfooconfig.yaml defaultTest.

# --- Anachronism traps: ingredients pushing banned-world foods -----------

- description: "Anachronism: fantasy grain requesting potato"
  vars:
    ingredient: "earthmarrow tuber of the root choir"
    theme: fantasy
    meal_type: main course
    banned: potato
  assert:
    - type: python
      value: file://qa_structure.py
    - type: python
      value: file://banned.py

- description: "Anachronism: fantasy feast resisting maize"
  vars:
    ingredient: "goldkernel of the harvest god"
