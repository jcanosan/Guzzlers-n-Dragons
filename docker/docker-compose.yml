services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - USDA_API_KEY=${USDA_API_KEY:-}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-guzzlers-n-dragons}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - DATABASE_URL=sqlite:///data/ingredients.db
      - CHROMA_PERSIST_DIR=/app/data/chroma
    volumes:
      - ../data/ingredients.db:/app/data/ingredients.db
      - ../data/chroma:/app/data/chroma
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Run tests in container
  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: test
    command: ["pytest", "-v", "--cov=src", "--cov-report=term-missing"]
    environment:
      - USDA_API_KEY=${USDA_API_KEY:-}
    profiles:
      - testing